name = "indexnow4openrin"
main = "worker.js"
compatibility_date = "2024-01-01"

# 定时任务：每天 UTC 16:00（北京时间 0:00）执行
[triggers]
crons = ["0 16 * * *"]

# D1 数据库绑定（只读，用于读取 openRin 博客文章）
[[d1_databases]]
binding = "DB"
database_name = "your-d1-database-name"
database_id = "your-d1-database-id"

# KV 存储绑定（用于状态追踪和日志）
[[kv_namespaces]]
binding = "INDEXNOW_KV"
id = "your-kv-namespace-id"
